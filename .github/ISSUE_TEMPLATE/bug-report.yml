name: "🐞 Bug report"
description: "Something broken in discovery, matching, or a crawl workflow"
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you run (or say to the agent), and what went wrong?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
  - type: input
    id: agent
    attributes:
      label: Agent & environment
      placeholder: "e.g. Claude Code 2.x / Cursor / Codex, Windows 11, Python 3.12"
  - type: textarea
    id: logs
    attributes:
      label: Relevant output / logs
      render: shell
