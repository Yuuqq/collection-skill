<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430" role="img" aria-label="How collection-skill works">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="880" height="430" fill="url(#fbg)" rx="14"/>

  <!-- Lane A: Discover -->
  <g>
    <rect x="40" y="40" width="800" height="150" rx="12" fill="#0ea5e9" fill-opacity="0.06" stroke="#0ea5e9" stroke-opacity="0.35" stroke-dasharray="4 4"/>
    <text x="60" y="66" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#0369a1">① DISCOVER &amp; CATALOG</text>

    <!-- GitHub -->
    <g transform="translate(70,90)">
      <rect width="160" height="80" rx="10" fill="#fff" stroke="#cbd5e1"/>
      <text x="80" y="32" text-anchor="middle" font-family="Segoe UI, Arial" font-size="22">🐙</text>
      <text x="80" y="58" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" font-weight="600" fill="#0f172a">GitHub search</text>
      <text x="80" y="74" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" fill="#64748b">topics · keywords</text>
    </g>
    <path d="M240 130 H300" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arr)"/>

    <!-- discover_repos.py -->
    <g transform="translate(310,90)">
      <rect width="170" height="80" rx="10" fill="#0f172a"/>
      <text x="85" y="30" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#7dd3fc">discover_repos.py</text>
      <text x="85" y="50" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" fill="#cbd5e1">dedupe · score</text>
      <text x="85" y="66" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" fill="#cbd5e1">preserve user fields</text>
    </g>
    <path d="M490 130 H550" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arr)"/>

    <!-- catalog.json -->
    <g transform="translate(560,90)">
      <rect width="180" height="80" rx="10" fill="#fff" stroke="#22c55e" stroke-opacity="0.6"/>
      <text x="90" y="32" text-anchor="middle" font-family="Segoe UI, Arial" font-size="22">🗃️</text>
      <text x="90" y="56" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#0f172a">tool-catalog.json</text>
      <text x="90" y="72" text-anchor="middle" font-family="Segoe UI, Arial" font-size="10" fill="#64748b">canonical source of truth</text>
    </g>
    <path d="M650 170 V200 H440 V210" stroke="#94a3b8" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  </g>

  <!-- Lane B: Match & Crawl -->
  <g>
    <rect x="40" y="220" width="800" height="170" rx="12" fill="#a855f7" fill-opacity="0.06" stroke="#a855f7" stroke-opacity="0.35" stroke-dasharray="4 4"/>
    <text x="60" y="246" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#7e22ce">② MATCH &amp; CRAWL · progressive disclosure</text>

    <g transform="translate(60,275)">
      <rect width="150" height="90" rx="10" fill="#fff" stroke="#cbd5e1"/>
      <text x="75" y="30" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" font-weight="600">User</text>
      <text x="75" y="50" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" fill="#64748b">“I want to</text>
      <text x="75" y="66" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" fill="#64748b">scrape X”</text>
      <text x="75" y="82" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" fill="#64748b">“抓 X 数据”</text>
    </g>
    <path d="M210 320 H255" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arr)"/>

    <g transform="translate(265,275)">
      <rect width="150" height="90" rx="10" fill="#e0f2fe" stroke="#0ea5e9"/>
      <text x="75" y="34" text-anchor="middle" font-size="22">🗂️</text>
      <text x="75" y="58" text-anchor="middle" font-family="Segoe UI, Arial" font-size="12" font-weight="600">Category</text>
      <text x="75" y="74" text-anchor="middle" font-family="Segoe UI, Arial" font-size="12" font-weight="600">menu</text>
    </g>
    <path d="M415 320 H460" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arr)"/>

    <g transform="translate(470,275)">
      <rect width="150" height="90" rx="10" fill="#f3e8ff" stroke="#a855f7"/>
      <text x="75" y="34" text-anchor="middle" font-size="22">📇</text>
      <text x="75" y="58" text-anchor="middle" font-family="Segoe UI, Arial" font-size="12" font-weight="600">Tool card</text>
      <text x="75" y="74" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" fill="#64748b">+ use cases</text>
    </g>
    <path d="M620 320 H665" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arr)"/>

    <g transform="translate(675,275)">
      <rect width="150" height="90" rx="10" fill="#fce7f3" stroke="#ec4899"/>
      <text x="75" y="34" text-anchor="middle" font-size="22">🕷️</text>
      <text x="75" y="58" text-anchor="middle" font-family="Segoe UI, Arial" font-size="12" font-weight="600">Confirm →</text>
      <text x="75" y="74" text-anchor="middle" font-family="Segoe UI, Arial" font-size="12" font-weight="600">Crawl</text>
    </g>
  </g>
</svg>
