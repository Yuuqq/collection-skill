  <rect width="600" height="380" rx="18" fill="url(#dt-bg)" stroke="#bbf7d0"/>
  <rect x="0" y="0" width="600" height="8" rx="4" fill="url(#dt-accent)"/>

  <g transform="translate(40,46)">
