<svg xmlns="http://www.w3.org/2000/svg" width="600" height="380" viewBox="0 0 600 380" role="img" aria-label="web-scraper category card">
  <defs>
    <linearGradient id="ws-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="ws-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
  </defs>

  <rect width="600" height="380" rx="18" fill="url(#ws-bg)" stroke="#bae6fd"/>
  <rect x="0" y="0" width="600" height="8" rx="4" fill="url(#ws-accent)"/>

  <!-- header -->
  <g transform="translate(40,46)">
    <circle cx="26" cy="26" r="26" fill="#0ea5e9"/>
    <text x="26" y="35" text-anchor="middle" font-size="30">🕸️</text>
    <text x="70" y="24" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#0c4a6e">web-scraper</text>
    <text x="70" y="46" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#0369a1">Static HTML · simple HTTP fetch</text>
  </g>

  <!-- stat chips -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">
    <g transform="translate(40,108)">
      <rect width="116" height="34" rx="17" fill="#fff" stroke="#7dd3fc"/>
      <text x="58" y="22" text-anchor="middle" fill="#0c4a6e">📦 42 tools</text>
    </g>
    <g transform="translate(164,108)">
      <rect width="138" height="34" rx="17" fill="#fff" stroke="#7dd3fc"/>
      <text x="69" y="22" text-anchor="middle" fill="#0c4a6e">🐍 Python 35</text>
    </g>
    <g transform="translate(310,108)">
      <rect width="120" height="34" rx="17" fill="#fff" stroke="#7dd3fc"/>
      <text x="60" y="22" text-anchor="middle" fill="#0c4a6e">HTTP + parse</text>
    </g>
  </g>

  <!-- examples -->
  <text x="40" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#0c4a6e" letter-spacing="0.5">STARRED EXAMPLES</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="14">
    <g transform="translate(40,188)">
      <rect width="520" height="40" rx="8" fill="#fff" stroke="#e0f2fe"/>
      <text x="14" y="25" fill="#0c4a6e" font-weight="600">D4Vinci/Scrapling</text>
      <text x="506" y="25" text-anchor="end" fill="#0369a1" font-size="12">⭐ 68.2k</text>
    </g>
    <g transform="translate(40,234)">
      <rect width="520" height="40" rx="8" fill="#fff" stroke="#e0f2fe"/>
      <text x="14" y="25" fill="#0c4a6e" font-weight="600">scrapy/scrapy</text>
      <text x="506" y="25" text-anchor="end" fill="#0369a1" font-size="12">⭐ 62.9k</text>
    </g>
    <g transform="translate(40,280)">
      <rect width="520" height="40" rx="8" fill="#fff" stroke="#e0f2fe"/>
      <text x="14" y="25" fill="#0c4a6e" font-weight="600">shengqiangzhang/examples-of-web-crawlers</text>
      <text x="506" y="25" text-anchor="end" fill="#0369a1" font-size="12">⭐ 14.7k</text>
    </g>
  </g>

  <text x="300" y="356" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">BeautifulSoup · httpx · Selectolax · Scrapy</text>
</svg>
